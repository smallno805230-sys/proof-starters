<body>
  <main>
    <header>
      <h1>高微證明起手式</h1>
      <p>看到高微證明題，第一句該怎麼寫？從例題練習辨認題型，再用英文起手式把證明寫下去。</p>
    </header>

    <section>
      <h2>筆記索引</h2>
      <ul>
        <li>
          <a href="topics/open-sets.html">開集合</a>
          <p>從集合裡任取一點，找出一個完全落在集合內的開球。</p>
        </li>
        <li>
          <a href="topics/limit-points.html">極限點</a>
          <p>證明任意小的鄰域裡，都有一個不同於極限點本身的集合元素。</p>
        </li>
        <li>
          <a href="topics/compactness.html">緊緻性</a>
          <p>從任意開覆蓋中選出一個包含該點的開集合，證明單點集合是緊緻的。</p>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
